name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/tripcosmos-agents
          rsync -a --exclude='.git' --exclude='.gitignore' --exclude='.github' \
            --exclude='build' --exclude='*.zip' --exclude='.DS_Store' \
            ./ build/tripcosmos-agents/
          cd build && zip -r ../tripcosmos-agents.zip tripcosmos-agents

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tripcosmos-agents.zip
          generate_release_notes: true
